[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "openwiki-server-sdk"
version = "0.1.0"
description = "OpenWiki Server 独立承载服务应用集成 SDK（wiki 实例 / 建页加工 / 检索 / 导出 / 异步任务）"
readme = "README.md"
requires-python = ">=3.12"
dependencies = ["httpx>=0.27,<1.0"]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[tool.setuptools]
package-dir = {"" = "."}

[tool.setuptools.packages.find]
where = ["."]
include = ["openwiki_server_sdk*"]
