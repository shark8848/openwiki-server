[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "openwiki-server"
version = "0.1.0"
description = "OpenWiki-backed wiki engine exposing HTTP/gRPC/Celery/MCP/CLI interfaces"
requires-python = ">=3.12"
dependencies = [
  # 核心依赖复用现有 venv 已装包（fastapi/uvicorn/pydantic/grpcio/protobuf/celery/typer）
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "pydantic>=2.0",
  "grpcio>=1.81",
  "protobuf>=5.29",
  "celery>=5.3",
  "typer>=0.12",
]

[project.scripts]
openwiki-server = "openwiki_engine.interfaces.cli:app"

[tool.setuptools]
package-dir = {"" = "."}

[tool.setuptools.packages.find]
where = ["."]
include = ["openwiki_engine*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
