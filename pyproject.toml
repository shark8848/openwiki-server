[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "openwiki-server"
version = "0.3.1"
description = "Lightweight SDK + Server for OpenWiki — wiki engine as standalone service with HTTP/gRPC/Celery/MCP/CLI interfaces and application integration SDK."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "shark8848", email = "admin@sharky-ai.com" }]
keywords = ["wiki", "openwiki", "knowledge-base", "llm", "sdk", "server", "rag"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: Text Processing :: Markup :: Markdown",
]
dependencies = [
    "httpx>=0.27,<1.0",
]

[project.optional-dependencies]
# Server extras
server = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.0",
    "grpcio>=1.81",
    "protobuf>=5.29",
    "celery>=5.3",
    "redis>=5.0",
    "typer>=0.12",
]
log-center = [
    "ikc-log-center>=1.4.22,<2",
]
all = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.0",
    "grpcio>=1.81",
    "protobuf>=5.29",
    "celery>=5.3",
    "redis>=5.0",
    "typer>=0.12",
    "ikc-log-center>=1.4.22,<2",
]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.21",
    "httpx>=0.27,<1.0",
    "ruff>=0.1",
]

[project.scripts]
openwiki-server = "openwiki_engine.interfaces.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["openwiki_engine"]

[tool.hatch.build.targets.sdist]
include = [
    "openwiki_engine/",
    "proto/",
    "pyproject.toml",
    "README.md",
    "LICENSE",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
