# ============================================================================
# HAProxy 代理层配置（与 openwiki-server 同一镜像，容器内反向代理）
#
# 拓扑（容器内）：client -> HAProxy(:8080 HTTP 入口 / :50052 gRPC / :8404 stats)
#                          -> uvicorn(127.0.0.1:18011，仅回环)
#                          -> gRPC(127.0.0.1:50052，仅回环)
# 说明：入口用高位端口，避免非 root（uid 1000）绑定特权端口对运行时内核参数的依赖；
#       宿主端口由 docker compose 映射（默认 18011 -> 8080、50052 -> 50052）。
#   - /health /ready      存活/就绪探针
#   - /api/v1/wiki/*      业务 API（envelope 与 open-ikc 对齐）
#
# 本文件为镜像内模板 /etc/haproxy/haproxy.cfg.tmpl，容器启动时由
# docker/entrypoint.sh 用 envsubst 渲染 ${HAPROXY_STATS_USER} /
# ${HAPROXY_STATS_PASSWORD} 后由 haproxy 加载（修改需重新构建镜像）。
#
# 安全说明：
#   - 引擎 uvicorn / gRPC 仅监听 127.0.0.1，对外不直接暴露，唯一入口为 HAProxy；
#   - gRPC 走 TCP 透传（HTTP/2），HAProxy 仅做端口分发与健康探测。
# ============================================================================

global
  log stdout format raw local0 notice
  maxconn 4096

defaults
  log global
  mode http
  option httplog
  option dontlognull
  option http-server-close
  timeout connect 5s
  timeout client 30s
  timeout server 60s
  timeout http-keep-alive 10s

# ---------- HTTP 入口 ----------
frontend web
  bind *:8080
  option forwardfor if-none
  default_backend openwiki_backend

  # 安全响应头（平台为 HTTP/JSON，统一加固）
  http-response set-header X-Content-Type-Options nosniff
  http-response set-header X-Frame-Options SAMEORIGIN
  http-response set-header Referrer-Policy strict-origin-when-cross-origin

# ---------- 引擎 HTTP 后端 ----------
backend openwiki_backend
  option httpchk GET /health
  server app 127.0.0.1:18011 check inter 3s fall 3 rise 2 maxconn 1024

# ---------- gRPC 入口（TCP 透传，HTTP/2） ----------
frontend grpc
  bind *:50052
  mode tcp
  option tcplog
  default_backend openwiki_grpc_backend

backend openwiki_grpc_backend
  mode tcp
  server grpc 127.0.0.1:50052 check inter 3s fall 3 rise 2

# ---------- HAProxy 监控（stats） ----------
listen stats
  bind *:8404
  mode http
  stats enable
  stats hide-version
  stats realm HAProxy\ Statistics
  stats uri /
  stats refresh 5s
  stats auth ${HAPROXY_STATS_USER}:${HAPROXY_STATS_PASSWORD}
